name: customadswidget
description: >-
  Non-intrusive custom ads for Flutter Web: image banners and templates loaded
  from a remote JSON, rotation, scheduling and viewable impression tracking.
version: 1.0.0
repository: https://github.com/DecksPlayer/customadswidget
issue_tracker: https://github.com/DecksPlayer/customadswidget/issues

topics:
  - ads
  - advertising
  - banner
  - web
  - widget

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
